[project]
name = "robotics-take-home"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "coacd>=1.0.14",
    "matplotlib",
    "mujoco",
    "numpy",
    "pillow",
    "rtree>=1.4.1",
    "scipy",
    "trimesh",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
